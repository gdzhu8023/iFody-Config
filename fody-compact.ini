; iFody compact Clash template
; 目标：保留节点地区分组，把代理规则收敛为国内访问、国外访问、AI、微软、苹果和兜底。

[custom]
; 规则按从上到下匹配，越具体的服务越靠前。

; 私有地址和本地直连
ruleset=🇨🇳 国内访问,[]GEOSITE,private
ruleset=🇨🇳 国内访问,[]GEOIP,private,no-resolve

; 个人覆盖规则：需要强制直连/代理时，优先放这里
ruleset=🇨🇳 国内访问,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Direct.list,28800
ruleset=🌍 国外访问,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Proxy.list,28800

; AI 服务：OpenAI / ChatGPT / Claude / Gemini / Copilot / Perplexity / xAI / Grok 等
ruleset=🤖 AI 服务,[]GEOSITE,openai
ruleset=🤖 AI 服务,[]GEOSITE,anthropic
ruleset=🤖 AI 服务,[]GEOSITE,google-gemini
ruleset=🤖 AI 服务,[]GEOSITE,category-ai-!cn
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list,28800
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list,28800
ruleset=🤖 AI 服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list,28800
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,oaiusercontent.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,anthropic.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,claude.ai
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,makersuite.google.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,ai.google.dev
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,copilot.microsoft.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,copilot.cloud.microsoft
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,sydney.bing.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,perplexity.ai
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,x.ai
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,grok.com

; 平台服务单独控制
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=Ⓜ️ 微软服务,[]GEOSITE,bing
ruleset=🍎 苹果服务,[]GEOSITE,apple

; 国内高频服务前置，剩余国内域名/IP 交给 GEOSITE,cn 和 GEOIP,cn 兜底
ruleset=🇨🇳 国内访问,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/WeChat/WeChat.list,28800
ruleset=🇨🇳 国内访问,[]GEOSITE,tencent
ruleset=🇨🇳 国内访问,[]GEOSITE,bilibili
ruleset=🇨🇳 国内访问,[]GEOSITE,alibaba
ruleset=🇨🇳 国内访问,[]GEOSITE,aliyun
ruleset=🇨🇳 国内访问,[]GEOSITE,baidu
ruleset=🇨🇳 国内访问,[]GEOSITE,jd
ruleset=🇨🇳 国内访问,[]GEOSITE,netease
ruleset=🇨🇳 国内访问,[]GEOSITE,bytedance

; 国内直连补充：国内 CDN、游戏下载 CDN、公共 Tracker 等
ruleset=🇨🇳 国内访问,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.list,28800
ruleset=🇨🇳 国内访问,[]GEOSITE,google-cn
ruleset=🇨🇳 国内访问,[]GEOSITE,category-games@cn
ruleset=🇨🇳 国内访问,[]GEOSITE,category-public-tracker
ruleset=🇨🇳 国内访问,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Steam_CDN.list,28800
ruleset=🇨🇳 国内访问,https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Game_Download_CDN.list,28800

; 国外访问兜底：常见被墙站点和非中国大陆域名
ruleset=🌍 国外访问,[]GEOSITE,gfw
ruleset=🌍 国外访问,[]GEOSITE,geolocation-!cn

; 国内域名/IP 最后兜底直连
ruleset=🇨🇳 国内访问,[]GEOSITE,cn
ruleset=🇨🇳 国内访问,[]GEOIP,cn,no-resolve

; 未命中的流量由漏网之鱼手动决定
ruleset=🐟 漏网之鱼,[]FINAL

; 策略分组
custom_proxy_group=节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🇰🇷 韩国节点`[]🇨🇦 加拿大节点`[]🇬🇧 英国节点`[]🇫🇷 法国节点`[]🇩🇪 德国节点`[]🇳🇱 荷兰节点`[]🇹🇷 土耳其节点`[]🇻🇳 越南节点`[]手动切换`[]DIRECT
custom_proxy_group=手动切换`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇨🇳 国内访问`select`[]DIRECT`[]手动切换`[]♻️ 自动选择
custom_proxy_group=🌍 国外访问`select`[]节点选择`[]♻️ 自动选择`[]手动切换`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🇰🇷 韩国节点`[]🇨🇦 加拿大节点`[]🇬🇧 英国节点`[]🇫🇷 法国节点`[]🇩🇪 德国节点`[]🇳🇱 荷兰节点`[]🇹🇷 土耳其节点`[]🇻🇳 越南节点
custom_proxy_group=🤖 AI 服务`select`[]节点选择`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]手动切换`[]♻️ 自动选择`[]🇬🇧 英国节点`[]🇨🇦 加拿大节点`[]🇩🇪 德国节点`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🇨🇳 国内访问`[]🌍 国外访问`[]手动切换`[]♻️ 自动选择
custom_proxy_group=🍎 苹果服务`select`[]🇨🇳 国内访问`[]🌍 国外访问`[]手动切换`[]♻️ 自动选择
custom_proxy_group=🐟 漏网之鱼`select`[]🌍 国外访问`[]🇨🇳 国内访问`[]手动切换`[]♻️ 自动选择

